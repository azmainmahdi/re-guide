# Builds installers for macOS (Apple Silicon and Intel) and Windows, and attaches them to a draft release.
# Run it by pushing a tag like v0.1.0, or by hand from the Actions tab.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-latest, args: --target aarch64-apple-darwin }
          - { platform: macos-latest, args: --target x86_64-apple-darwin }
          - { platform: windows-latest, args: '' }
    runs-on: ${{ matrix.platform }}
    env:
      PYTHONUTF8: '1' # Windows Python reads files as cp1252 otherwise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      - run: node tests/guide.test.js
      - run: python build/build.py
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Re;Guide v__VERSION__'
          releaseBody: 'Beta. How to install is in the README.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
